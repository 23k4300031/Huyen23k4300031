<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lab 11 - Vé Concert BigBang (Nhóm 5)</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            color: #172033;
        }

        button,
        input {
            font: inherit;
            padding: 10px;
            margin: 6px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <h2>Lab 11: Giao diện Web3 DApp - Concert BigBang</h2>
    <div class="card">
        <button id="btnConnect">Kết nối ví MetaMask</button>
        <p><b>Địa chỉ ví:</b> <span id="account">Chưa kết nối</span></p>
    </div>
    <div class="card">
        <h3>Tra cứu thông tin vé</h3>
        <input id="tokenId" type="number" placeholder="Nhập Token ID (VD: 1)">
        <button id="btnCheck">Kiểm tra chủ sở hữu vé</button>
        <p id="result"></p>
    </div>

    <script>
        // Thay địa chỉ contract EventTicket của nhóm bạn vào đây
        const CONTRACT_ADDRESS = "0x................................";
        const CONTRACT_ABI = [
            "function ownerOf(uint256 tokenId) view returns (address)"
        ];

        let provider, signer, contract;

        document.getElementById("btnConnect").onclick = async () => {
            if (!window.ethereum) return alert("Vui lòng cài đặt MetaMask!");
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
            document.getElementById("account").textContent = await signer.getAddress();
        };

        document.getElementById("btnCheck").onclick = async () => {
            try {
                const id = document.getElementById("tokenId").value;
                const owner = await contract.ownerOf(id);
                document.getElementById("result").textContent = "Chủ sở hữu vé #" + id + " là: " + owner;
            } catch (err) {
                document.getElementById("result").textContent = "Lỗi: Vé không tồn tại hoặc chưa được phát hành.";
            }
        };
    </script>
</body>

</html>
